name: islami_app_c19_sun
description: "A new Flutter project."

publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: ^3.12.2


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0


flutter_gen:
  output: lib/core/gen/

  # Optional
  integrations:
    image: true
    flutter_svg: true

flutter:


  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/


  fonts:
    - family: Janna
      fonts:
        - asset: assets/fonts/Janna_LT.ttf


